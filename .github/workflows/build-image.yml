name: build-image

# Builds frigate-maxwell on top of the official Frigate image and pushes it to GHCR.
on:
  workflow_dispatch:
    inputs:
      frigate_tag:
        description: Frigate image tag to build on
        default: stable
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: [docker/Dockerfile, .github/workflows/build-image.yml]

permissions:
  contents: read
  packages: write

env:
  ORT_TAG: v1.18.1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "ort-${ORT_TAG}-sm50" -p '*.whl' -D wheel
      - name: Build, smoke test, push
        env:
          FRIGATE_TAG: ${{ inputs.frigate_tag || 'stable' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frigate-maxwell"
          base="ghcr.io/blakeblackshear/frigate:${FRIGATE_TAG}"
          docker pull "$base"
          full=$(docker run --rm --entrypoint python3 "$base" -c 'import sys; sys.path.insert(0, "/opt/frigate"); from frigate.version import VERSION; print(VERSION)')
          version="${full%%-*}"
          echo "Frigate $full -> tag $version"
          if docker manifest inspect "$image:$version" >/dev/null 2>&1 && [ "${{ github.event_name }}" = schedule ]; then
            echo "$image:$version already published, nothing to do"; exit 0
          fi
          docker build --build-arg FRIGATE_TAG="$FRIGATE_TAG" -f docker/Dockerfile -t "$image:$version" -t "$image:$FRIGATE_TAG" .
          # No GPU on the runner: check the module imports and the CUDA provider has no unresolved libs.
          docker run --rm --entrypoint sh "$image:$version" -c '
            python3 -c "import onnxruntime as o; print(o.__version__)" &&
            ! ldd /usr/local/lib/python3.11/dist-packages/onnxruntime/capi/libonnxruntime_providers_cuda.so | grep "not found"'
          docker push "$image:$version"
          docker push "$image:$FRIGATE_TAG"
